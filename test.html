<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPdesk Release Notes Grid</title>

<!-- Externe moderne styling -->
<link rel="stylesheet" href="https://developers.topdesk.com/odata_ui/assets/the-app-BMSxduOa.css">

<!-- Syncfusion CSS -->
<link href="https://cdn.syncfusion.com/ej2/26.2.5/material.css" rel="stylesheet">

<style>
  body { margin:0; font-family: "Segoe UI", sans-serif; background:#f8f8f8; display:flex; flex-direction:column; height:100vh; }
  .header, .footer { padding:16px; background:#fff; border-bottom:1px solid #e1dfdd; }
  .header__main-title { margin:0; font-size:1.8rem; font-weight:600; }
  .header__description { margin:4px 0 0; color:#555; }
  #gridContainer { flex:1; overflow:auto; padding:16px; }
  .footer { border-top:1px solid #e1dfdd; margin-top:auto; text-align:center; color:#666; font-size:0.9rem; }
</style>
</head>
<body>

<div class="header">
  <h1 data-v-6cef0fad="" class="header__main-title">TOPdesk Release Notes</h1>
  <p data-v-6cef0fad="" class="header__description" data-testid="description">Explore every OData field with clear metadata, so you can assemble dashboards and reports in any BI tool with confidence.</p>
</div>

<div id="gridContainer">
  <div id="grid"></div>
</div>

<div class="footer">
  &copy; 2025 IT Services / TOPdesk Release Viewer
</div>

<!-- Syncfusion JS -->
<script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2.min.js"></script>
<script>
  // Syncfusion License
  ej.base.License.register("Ngo9BigBOggjHTQxAR8/V1JGaF5cXGpCf1FpRmJGdld5fUVHYVZUTXxaS00DNHVRdkdmWH1ceXRSR2lcVkxyWEJWYEs=");

  async function loadData() {
    const res = await fetch("https://topdesk-release-notes.r-roodenburg.workers.dev/");
    const json = await res.json();

    // releaseDate strings naar Date objects
    return json.notes.map(n => ({ ...n, releaseDate: new Date(n.releaseDate) }));
  }

  function renderGrid(data) {
    const grid = new ej.grids.Grid({
      dataSource: data,
      height: "100%",
      allowPaging: true,
      pageSettings: { pageSize: 20 },
      allowSorting: true,
      allowFiltering: true,
      allowGrouping: true,
      toolbar: ['Search'],
      groupSettings: { columns: ['releaseDate'] },
      columns: [
        { field: "release", headerText: "Release", width: 100 },
        { field: "releaseDate", headerText: "Release Date", width: 140, type:'date', format:'yyyy-MM-dd' },
        { field: "descriptionHtml", headerText: "Description", width: 350, template:"<div style='white-space:normal'>${descriptionHtml}</div>", allowGrouping:false },
        { field: "category", headerText: "Category", width:150 },
        { field: "subcategory", headerText: "Subcategory", width:150 },
        { field: "SourceTag", headerText: "Source", width:100 },
        { field: "hosting", headerText: "Hosting", width:150 },
        { field: "isTosNote", headerText: "TOS", width:80 }
      ]
    });
    grid.appendTo('#grid');
  }

  (async function init() {
    const data = await loadData();
    renderGrid(data);
  })();
</script>

</body>
</html>
