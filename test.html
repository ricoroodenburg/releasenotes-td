<div id="grid" style="height:500px;"></div>

<script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2-base.min.js"></script>
<script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2-data.min.js"></script>
<script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2-grids.min.js"></script>

<script>
  const data = [
    { release: "1.0", releaseDate: new Date(), descriptionHtml:"Test", category:"Cat1", subcategory:"Sub1", SourceTag:"Feature", hosting:{saas:true}, isTosNote:true }
  ];

  const grid = new ej.grids.Grid({
    dataSource: data,
    height: "400px",
    columns: [
      { field: "release", headerText: "Release" },
      { field: "releaseDate", headerText: "Release Date", type:'date', format:'yyyy-MM-dd' }
    ]
  });

  grid.appendTo('#grid');
</script>
