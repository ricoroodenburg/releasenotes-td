<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPdesk Release Notes Grid</title>

<!-- Externe moderne styling -->
<link rel="stylesheet" href="https://developers.topdesk.com/odata_ui/assets/the-app-BMSxduOa.css">
<link rel="stylesheet" href="https://developers.topdesk.com/odata_ui/assets/index-ByzTjbNn.css">

<!-- Syncfusion CSS -->
<link href="https://cdn.syncfusion.com/ej2/26.2.5/material.css" rel="stylesheet">

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
  
<style>
  body { 
    margin:0; 
    font-family: "Segoe UI", sans-serif; 
    background:#f8f8f8; 
    display:flex; 
    flex-direction:column; 
    height:100vh; 
  }
  .header, .footer { 
    padding:16px; 
    background:#fff; 
    border-bottom:1px solid #e1dfdd; 
  }
  .header__main-title {
    margin:0; 
    font-size:1.8rem; 
    font-weight:600; 
  }
  .header__description { 
    margin:4px 0 0; 
    color:#555; 
  }

  /* Fix voor grid zichtbaarheid */
  .table-container {
    height: calc(100vh - 140px) !important;
    min-height: 0 !important;
    overflow: auto !important;
  }
  #grid { 
    height: 100%; 
  }

  .footer { 
    border-top:1px solid #e1dfdd; 
    margin-top:auto; 
    text-align:center; 
    color:#666; 
    font-size:0.9rem; 
  }

  /* Badges */
  .badge { 
    padding:2px 6px; 
    border-radius:4px; 
    font-size:0.8rem; 
    color:white; 
    display:inline-block; 
  }
  .success { 
    background-color:#107C10; 
  }
  .info { 
    background-color:#0078D4; 
  }
</style>
</head>
<body>

<div data-v-6cef0fad="" data-v-72cbc74f="" class="header__content" data-testid="header-content">
  <h1 data-v-6cef0fad="" class="header__main-title" data-testid="main-title">Release Notes</h1>
  <p data-v-6cef0fad="" class="header__description" data-testid="description">Description here</p>
</div>

<div data-v-72cbc74f="" class="table-container">
  <!-- <div id="grid"></div> -->
  <div id="grid" style="height:500px;"></div>
</div>

<div class="footer">
  &copy; 2025 IT Services / TOPdesk Release Viewer
</div>

<!-- Syncfusion JS -->
<script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2.min.js"></script>
<script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2-grids.min.js"></script>
<script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2-base.min.js"></script>
<script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2-data.min.js"></script>
<script>
  // Syncfusion License
  ej.base.License.register("Ngo9BigBOggjHTQxAR8/V1JGaF5cXGpCf1FpRmJGdld5fUVHYVZUTXxaS00DNHVRdkdmWH1ceXRSR2lcVkxyWEJWYEs=");

  async function loadData() {
    const res = await fetch("https://topdesk-release-notes.r-roodenburg.workers.dev/");
    const json = await res.json();
    // releaseDate strings naar Date objects
    console.log(json.notes);
    return json.notes.map(n => ({ ...n, releaseDate: new Date(n.releaseDate) }));
    
  }

  function renderGrid(data) {
    const grid = new ej.grids.Grid({
      dataSource: data,
      height: "100%",
      allowPaging: true,
      pageSettings: { pageSize: 20 },
      allowSorting: true,
      allowFiltering: true,
      allowGrouping: true,
      toolbar: ['Search'],
      groupSettings: { columns: ['releaseDate'] },
      columns: [
        { field: "release", headerText: "Release", width: 100 },
        { field: "releaseDate", headerText: "Release Date", width: 140, type:'date', format:'yyyy-MM-dd' },
        { field: "descriptionHtml", headerText: "Description", width: 350, allowGrouping:false,
          template: data => `<div style="white-space:normal;">${data.descriptionHtml}</div>` },
        { field: "category", headerText: "Category", width:150 },
        { field: "subcategory", headerText: "Subcategory", width:150 },
        { headerText:"Source", width:100, template: data => {
            if(data.SourceTag==="Feature") return `<span class="badge success">Feature</span>`;
            if(data.SourceTag==="API") return `<span class="badge info">API</span>`;
            return "";
        }},
        { headerText:"Hosting", width:150, template: data => {
            let html="";
            if(data.hosting?.saas) html+= `<span class="badge success" style="margin-right:5px">SAAS</span>`;
            if(data.hosting?.onpremisesvirtualappliance) html+= `<span class="badge info">Virtual Appliance</span>`;
            return html;
        }, allowFiltering:false, allowSorting:false },
        { field:"isTosNote", headerText:"TOS", width:80, template: data => {
            return data.isTosNote ? `<span class="badge success">True</span>` : `<span class="badge info">False</span>`;
        }, headerTooltip:"True: legacy system, False: modern system." }
      ]
    });
    grid.appendTo('#grid');
  }

  (async function init() {
    const data = await loadData();
    renderGrid(data);
  })();
</script>

</body>
</html>
