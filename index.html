<body>
	<div class="header">
		<div class="header__container">
			<div class="header__navigation">
				<slot name="navigation"></slot>
				<div class="header__text">
					<slot name="header">
						<h1 class="header__text-title">
							<span data-i18n="header.title"></span>
							<span class="status-badge primary">2601.01.07</span>
						</h1>
					</slot>
					<p class="header__text-body" data-i18n="header.description"></p>
				</div>
			</div>
			<div class="header__actions">
				<div id="buttonToolbar">
					<button class="button" id="btn1">
						<span class="button-content">
							<span class="svg-button-grid"></span>
						</span>
					</button>
					<button class="button" id="btn2">
						<span class="button-content">
							<span class="svg-button-calender"></span>
						</span>
					</button>
					<button class="button more-btn invoker__icon" id="moreBtn"></button>

			</div>

	<div data-v-72cbc74f="" class="content">

					${template(data)}

		<div class="content-desktop">
			<div id="grid"></div>

	<script src="./scripts/buttons.js"></script>

	<script src="./scripts/grid.js"></script>
	<script src="./scripts/calendar.js"></script>
	<script src="./scripts/listview.js"></script>
	<script src="./scripts/popup.js"></script>
	<script>

		document.addEventListener("DOMContentLoaded", function () {

			const btnGrid = document.getElementById("btn1");
			const btnCal = document.getElementById("btn2");

			const divGrid = document.getElementById("grid");
			const divCal = document.getElementById("calendar");

			divGrid.classList.add("view-active");
			btnGrid.classList.add("selected");

			btnGrid.addEventListener("click", function () {
				divGrid.classList.add("view-active");
				divCal.classList.remove("view-active");

				btnGrid.classList.add("selected");
				btnCal.classList.remove("selected");
			});

			btnCal.addEventListener("click", function () {
				divCal.classList.add("view-active");
				divGrid.classList.remove("view-active");

				btnCal.classList.add("selected");
				btnGrid.classList.remove("selected");
			});

		});
	</script>
