<div data-v-6cef0fad="" data-v-72cbc74f="" class="header__content" data-testid="header-content">
  <h1 data-v-6cef0fad="" class="header__main-title" data-testid="main-title">TOPdesk Release Notes</h1>
  <p data-v-6cef0fad="" class="header__description" data-testid="description">Version 2512.01-beta</p>
</div>


<div data-v-72cbc74f="" class="table-container">
	<div id="grid"></div>
</div>

<!--
<div class="footer">
  &copy; 2025 IT Services / TOPdesk Release Viewer
</div>
-->

<!-- Syncfusion UMD bundle -->
<script src="https://cdn.syncfusion.com/ej2/32.1.19/dist/ej2.min.js"></script>

<script>

	ej.base.registerLicense("Ngo9BigBOggjHTQxAR8/V1JGaF5cXGpCf1FpRmJGdld5fUVHYVZUTXxaS00DNHVRdkdmWH1ceXVVRmBeWUB0VkFWYEs=");

  async function loadData() {
    try {
      const res = await fetch("https://topdesk-release-notes.r-roodenburg.workers.dev/");
      const json = await res.json();
      return json.notes.map(n => ({ ...n, releaseDate: new Date(n.releaseDate) }));
    } catch(e) {
      console.error("Failed to load data", e);
      return [];
    }
  }

  async function init() {
    const data = await loadData();
	
	const toolbarOptions = [
	  { text: 'Search', align: 'Left' },
	  { text: 'Refresh', align: 'Right', tooltipText: 'Reload data', prefixIcon: 'e-refresh', id: 'refresh' }
	];
	
	const filterSettings = {
		type: 'Excel'
	};

    const grid = new ej.grids.Grid({
      dataSource: data,
      height: '100%',
      allowPaging: true,
      pageSettings: { pageSize: 10 },
      allowSorting: true,
	  allowMultiSorting: true,
	  showColumnMenu: true,
      allowFiltering: true,
	  filterSettings: filterSettings,
      allowGrouping: false,
	  toolbar: toolbarOptions,
      groupSettings: { columns: ['releaseDate'], showDropArea: true },
		allowResizing: true,
		allowReordering: true,
      columns: [
        { field: "release", headerText: "Release", width: 100 },
        { field: "releaseDate", headerText: "Release Date", width: 140, type:'date', format:'yyyy-MM-dd' },
        { field: "descriptionHtml", headerText: "Description", width: 350,
          template: data => `<div style="white-space:normal;">${data.descriptionHtml}</div>` },
        { field: "category", headerText: "Category", width:150 },
        { field: "subcategory", headerText: "Subcategory", width:150 },
        { headerText:"Source", width:100, template: data => {
            if(data.SourceTag==="Feature") return `<span class="status-badge success">Feature</span>`;
            if(data.SourceTag==="API") return `<span class="status-badge primary">API</span>`;
            return "";
        }},
        { headerText:"Hosting", width:150, template: data => {
            let html="";
            if(data.hosting?.saas) html+= `<span class="status-badge success" style="margin-right:5px">SAAS</span>`;
            if(data.hosting?.onpremisesvirtualappliance) html+= `<span class="status-badge danger">Virtual Appliance</span>`;
            return html;
        }, allowFiltering:false, allowSorting:false },
        { field:"isTosNote", headerText:"TOS", width:80, template: data => {
            return data.isTosNote ? `<span class="status-badge success">True</span>` : `<span class="status-badge danger">False</span>`;
        }}
      ]
    });

    grid.appendTo('#grid');
  }

  init();
</script>

</body>
</html>
