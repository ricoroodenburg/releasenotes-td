<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPdesk Release Notes V2</title>

  <!-- Werkende Fluent UI CSS -->
  <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css" />

  <!-- Syncfusion CSS & JS -->
  <link href="https://cdn.syncfusion.com/ej2/26.2.5/material.css" rel="stylesheet">
  <script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2.min.js"></script>

  <!-- Syncfusion License -->
  <script>
    // Plaats dit **na** ej2.min.js
    ej.base.License.register("Ngo9BigBOggjHTQxAR8/V1JGaF5cXGpCf1FpRmJGdld5fUVHYVZUTXxaS00DNHVRdkdmWH1ceXRSR2lcVkxyWEJWYEs=");
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f3f2f1;
      --text: #212121;
      --card-bg: #ffffff;
      --card-border: #e1dfdd;
    }
    [data-theme="dark"] {
      --bg: #1b1b1b;
      --bg-alt: #252525;
      --text: #e7e7e7;
      --card-bg: #252525;
      --card-border: #3a3a3a;
    }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;}
    .navbar { display:flex; justify-content:space-between; padding:12px 16px; background:var(--bg-alt); border-bottom:1px solid var(--card-border); position:sticky; top:0; z-index:1000;}
    .navbar button { margin-right:6px; }
    button { cursor:pointer; border-radius:4px; border:1px solid var(--card-border); padding:6px 10px; background:var(--bg); color:var(--text);}
    button:hover{background:var(--bg-alt);}
    #loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(2px);z-index:2000;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:bold;}
    .view{display:none;padding:16px;}
    #tilesView{display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(280px,1fr));}
    .tile{border:1px solid var(--card-border); padding:16px; border-radius:6px; background:var(--card-bg);}
    #detailsView .detail-card{border-bottom:1px solid var(--card-border); margin-bottom:16px; padding-bottom:16px;}
    #calendarView{min-height:400px;border:2px dashed var(--card-border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text);}
  </style>
</head>
<body>

<div id="loading">⏳ Loading...</div>

<div class="navbar">
  <div>
    <button onclick="setView('grid')">📊 Grid v1</button>
    <button onclick="setView('tiles')">🔳 Tiles</button>
    <button onclick="setView('details')">📄 Details</button>
    <button onclick="setView('calendar')">📅 Calendar</button>
  </div>
  <div>
    <button onclick="toggleTheme()">🌓</button>
  </div>
</div>

<div id="gridView" class="view"></div>
<div id="tilesView" class="view"></div>
<div id="detailsView" class="view"></div>
<div id="calendarView" class="view">📅 Calendar placeholder</div>

<script>
  let releaseData=[];
  let renderedViews={};

  // THEME
  function toggleTheme(){
    const root=document.documentElement;
    root.setAttribute("data-theme", root.getAttribute("data-theme")==='light'?'dark':'light');
  }

  // LOADING
  function showLoading(){document.getElementById("loading").style.display="flex";}
  function hideLoading(){document.getElementById("loading").style.display="none";}

  // VIEW SWITCHER
  function setView(view){
    ['gridView','tilesView','detailsView','calendarView'].forEach(v=>document.getElementById(v).style.display='none');
    if(view==='grid') document.getElementById('gridView').style.display='block';
    if(view==='tiles') document.getElementById('tilesView').style.display='grid';
    if(view==='details') document.getElementById('detailsView').style.display='block';
    if(view==='calendar') document.getElementById('calendarView').style.display='flex';

    // Lazy render
    if(!renderedViews[view]){
      if(view==='grid') renderGrid();
      if(view==='tiles') renderTiles();
      if(view==='details') renderDetails();
      renderedViews[view]=true;
    }
  }

  // FETCH DATA
  async function loadData(){
    showLoading();
    const res = await fetch("https://topdesk-release-notes.r-roodenburg.workers.dev/");
    const json = await res.json();

    // Convert releaseDate strings to Date objects
    releaseData = json.notes.map(r=>{
      return {...r, releaseDate: new Date(r.releaseDate)};
    });

    hideLoading();
    setView('grid');
  }

  // Virtualized batch rendering
  function batchRender(container, items, renderFn, batchSize=50){
    let index=0;
    function renderBatch(){
      const frag=document.createDocumentFragment();
      for(let i=0;i<batchSize && index<items.length;i++,index++){
        frag.appendChild(renderFn(items[index]));
      }
      container.appendChild(frag);
      if(index<items.length) requestIdleCallback(renderBatch);
    }
    renderBatch();
  }

  // GRID
  function renderGrid(){
    const grid = new ej.grids.Grid({
      dataSource: releaseData,
      allowPaging:true,
      allowSorting:true,
      allowFiltering:true,
      allowGrouping:true,
      groupSettings:{columns:['releaseDate']},
      height:650,
      columns:[
        { field:"releaseDate", headerText:"Datum", width:150, type:'date', format:'yyyy-MM-dd' },
        { field:"release", headerText:"Release", width:150 },
        { field:"descriptionHtml", headerText:"Description", width:400, template:"<div>${descriptionHtml}</div>" 
        { field:"category", headerText:"Categorie", width:200 },
        { field:"subcategory", headerText:"Subcategorie", width:200 },
        }
      ],
      enableVirtualization:false,
      rowHeight:60
    });
    grid.appendTo('#gridView');
  }

  // TILES
  function renderTiles(){
    const container=document.getElementById('tilesView');
    batchRender(container, releaseData, item=>{
      const div=document.createElement('div');
      div.className='tile';
      div.innerHTML=`<h3>${item.release}</h3><p><strong>${item.releaseDate.toISOString().split('T')[0]}</strong></p><p>${item.category} → ${item.subcategory}</p>${item.descriptionHtml}`;
      return div;
    });
  }

  // DETAILS
  function renderDetails(){
    const container=document.getElementById('detailsView');
    batchRender(container, releaseData, item=>{
      const div=document.createElement('div');
      div.className='detail-card';
      div.innerHTML=`<h2>${item.release}</h2><p>${item.releaseDate.toISOString().split('T')[0]} — ${item.category} / ${item.subcategory}</p>${item.descriptionHtml}`;
      return div;
    });
  }

  // INIT
  loadData();
</script>
</body>
</html>
