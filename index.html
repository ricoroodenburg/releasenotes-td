<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPdesk Release Notes Viewer</title>

  <!-- Syncfusion CSS & JS -->
  <link href="https://cdn.syncfusion.com/ej2/26.2.5/material.css" rel="stylesheet">
  <script src="https://cdn.syncfusion.com/ej2/26.2.5/dist/ej2.min.js"></script>

  <!-- Syncfusion License -->
  <script>
    ej.base.License.register("Ngo9BigBOggjHTQxAR8/V1JGaF5cXGpCf1FpRmJGdld5fUVHYVZUTXxaS00DNHVRdkdmWH1ceXRSR2lcVkxyWEJWYEs=");
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f2f2f2;
      --text: #222;
      --card-bg: #fff;
      --card-border: #ddd;
    }

    [data-theme="dark"] {
      --bg: #1e1e1e;
      --bg-alt: #2a2a2a;
      --text: #e7e7e7;
      --card-bg: #2a2a2a;
      --card-border: #444;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background: var(--bg-alt);
    }

    /* Loading overlay */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    /* Views */
    #gridView,
    #tilesView,
    #detailsView,
    #calendarView {
      display: none;
      padding: 16px;
    }

    /* Tiles layout */
    #tilesView {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    .tile {
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 8px;
      background: var(--card-bg);
    }

    /* Calendar placeholder */
    #calendarView {
      min-height: 350px;
      border: 2px dashed var(--card-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div id="loading">⏳ Loading...</div>

  <!-- NAVIGATION -->
  <div class="navbar">
    <div>
      <button onclick="setView('grid')">📊 Grid</button>
      <button onclick="setView('tiles')">🔳 Tiles</button>
      <button onclick="setView('details')">📄 Details</button>
      <button onclick="setView('calendar')">📅 Calendar</button>
    </div>

    <div>
      <button onclick="toggleTheme()">🌓</button>
    </div>
  </div>

  <!-- VIEWS -->
  <div id="gridView"></div>
  <div id="tilesView"></div>
  <div id="detailsView"></div>
  <div id="calendarView">📅 Kalenderweergave komt hier</div>

  <script>
    let releaseData = [];

    /* -------------------------
         THEME SWITCHER
    --------------------------*/
    function toggleTheme() {
      const root = document.documentElement;
      const theme = root.getAttribute("data-theme");
      root.setAttribute("data-theme", theme === "light" ? "dark" : "light");
    }

    /* -------------------------
         LOADING OVERLAY
    --------------------------*/
    function showLoading() { 
      document.getElementById("loading").style.display = "flex"; 
    }
    function hideLoading() { 
      document.getElementById("loading").style.display = "none"; 
    }

    /* -------------------------
         FETCH DATA FROM WORKER
    --------------------------*/
    async function loadData() {
      showLoading();
      
      const res = await fetch("https://topdesk-release-notes.r-roodenburg.workers.dev/");
      const json = await res.json();

      releaseData = json.notes;

      hideLoading();

      renderGrid();
      renderTiles();
      renderDetails();
    }

    /* -------------------------
         VIEW SWITCHER
    --------------------------*/
    function setView(view) {
      document.getElementById("gridView").style.display = "none";
      document.getElementById("tilesView").style.display = "none";
      document.getElementById("detailsView").style.display = "none";
      document.getElementById("calendarView").style.display = "none";

      if (view === "grid") document.getElementById("gridView").style.display = "block";
      if (view === "tiles") document.getElementById("tilesView").style.display = "grid";
      if (view === "details") document.getElementById("detailsView").style.display = "block";
      if (view === "calendar") document.getElementById("calendarView").style.display = "flex";
    }

    /* -------------------------
         SYNCFUSION GRID
    --------------------------*/
    function renderGrid() {
      document.getElementById("gridView").innerHTML = "";

      const grid = new ej.grids.Grid({
        dataSource: releaseData,
        allowPaging: true,
        allowSorting: true,
        allowFiltering: true,
        allowGrouping: true,
        groupSettings: { columns: ['releaseDate'] },
        height: "650",
        columns: [
          { field: "releaseDate", headerText: "Datum", width: 150 },
          { field: "release", headerText: "Release", width: 150 },
          { field: "category", headerText: "Categorie", width: 200 },
          { field: "subcategory", headerText: "Subcategorie", width: 200 }
        ]
      });

      grid.appendTo("#gridView");
    }

    /* -------------------------
         TILES VIEW
    --------------------------*/
    function renderTiles() {
      const el = document.getElementById("tilesView");
      el.innerHTML = "";

      releaseData.forEach(r => {
        el.innerHTML += `
          <div class="tile">
            <h3>${r.release}</h3>
            <p><strong>${r.releaseDate}</strong></p>
            <p>${r.category} → ${r.subcategory}</p>
            <div>${r.descriptionHtml}</div>
          </div>
        `;
      });
    }

    /* -------------------------
         DETAILS VIEW
    --------------------------*/
    function renderDetails() {
      const el = document.getElementById("detailsView");
      el.innerHTML = "";

      releaseData.forEach(r => {
        el.innerHTML += `
          <div style="margin-bottom:20px; border-bottom:1px solid var(--card-border); padding-bottom:20px">
            <h2>${r.release}</h2>
            <p>${r.releaseDate} — ${r.category} / ${r.subcategory}</p>
            <div>${r.descriptionHtml}</div>
          </div>
        `;
      });
    }

    /* Start */
    loadData().then(() => setView("grid"));
  </script>
</body>
</html>
